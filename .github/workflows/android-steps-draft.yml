name: Android steps draft build
on:
  workflow_dispatch:
  push:
    branches: [arena/a9d62551-fitlife-ai-planner]
    paths:
      - 'full-stack-health-tracker/android-steps-draft/**'
      - '.github/workflows/android-steps-draft.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android prototype
        working-directory: full-stack-health-tracker/android-steps-draft
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/steps-build.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            grep -E '^(e: |\* What went wrong:|> |Execution failed for task|[[:space:]]+Could not|[[:space:]]+> Could not)' "$RUNNER_TEMP/steps-build.log" | head -12 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$result"
