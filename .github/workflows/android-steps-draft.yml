name: Android steps draft build
on:
  workflow_dispatch:
  push:
    branches: [arena/a9d62551-fitlife-ai-planner]
    paths:
      - 'full-stack-health-tracker/android-steps-draft/**'
      - '.github/workflows/android-steps-draft.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android prototype
        working-directory: full-stack-health-tracker/android-steps-draft
        run: gradle --no-daemon :app:assembleDebug
